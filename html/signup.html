<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your 10X CRM account and start managing your pipeline.">
  <title>Sign Up — 10X CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Public+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="auth-page">

  <main class="auth-container">

    <section class="auth-card" aria-labelledby="auth-title">

      <header class="auth-card__header">
        <a href="index.html" class="auth-card__brand">10X CRM</a>
        <h1 class="auth-card__title" id="auth-title">Create your account</h1>
        <p class="auth-card__subtitle">Set up your workspace in under a minute.</p>
      </header>

      <form id="signup-form" class="auth-form" novalidate>

        <div class="form-field">
          <label class="form-field__label" for="signup-fullname">Full Name</label>
          <input
            class="form-field__input"
            type="text"
            id="signup-fullname"
            name="fullname"
            placeholder="Jane Cooper"
            autocomplete="name"
          >
          <span class="field-error-msg hidden" id="signup-fullname-error" aria-live="polite"></span>
        </div>

        <div class="form-field">
          <label class="form-field__label" for="signup-email">Email</label>
          <input
            class="form-field__input"
            type="email"
            id="signup-email"
            name="email"
            placeholder="you@company.com"
            autocomplete="email"
          >
          <span class="field-error-msg hidden" id="signup-email-error" aria-live="polite"></span>
        </div>

        <div class="form-field">
          <label class="form-field__label" for="signup-company">Company</label>
          <input
            class="form-field__input"
            type="text"
            id="signup-company"
            name="company"
            placeholder="Company (optional)"
            autocomplete="organization"
          >
          <span class="field-error-msg hidden" id="signup-company-error" aria-live="polite"></span>
        </div>

        <div class="form-field">
          <label class="form-field__label" for="signup-password">Password</label>
          <input
            class="form-field__input"
            type="password"
            id="signup-password"
            name="password"
            placeholder="Create a password"
            autocomplete="new-password"
          >
          <span class="field-error-msg hidden" id="signup-password-error" aria-live="polite"></span>
        </div>

        <div class="form-field">
          <label class="form-field__label" for="signup-confirm-password">Confirm Password</label>
          <input
            class="form-field__input"
            type="password"
            id="signup-confirm-password"
            name="confirm-password"
            placeholder="Repeat your password"
            autocomplete="new-password"
          >
          <span class="field-error-msg hidden" id="signup-confirm-password-error" aria-live="polite"></span>
        </div>

        <button class="btn btn--primary auth-form__submit" type="submit">Create Account</button>

      </form>

      <p class="auth-card__redirect">
        Already have an account?
        <a class="auth-card__link" href="index.html">Log in</a>
      </p>

    </section>

  </main>

  <!-- JS logic added later: <script src="../js/auth.js" defer></script> -->

</body>
</html>
